[project]
name = "margind"
version = "0.1.0"
description = "Margin host daemon: drive Claude Code sessions on this machine from the Margin app"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "cryptography>=42",
  # Windows: ConPTY shells, and the process/port listing lsof and ps give elsewhere
  "pywinpty>=2; sys_platform == 'win32'",
  "psutil>=5.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
push = ["httpx[http2]>=0.27", "pyjwt[crypto]>=2.8"]
qr = ["qrcode>=7"]
dev = ["pytest>=8", "httpx>=0.27"]   # httpx: FastAPI's TestClient

[project.scripts]
margind = "margind.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["margind"]
