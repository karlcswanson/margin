name: daemon

on:
  push:
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  pull_request:
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The tests drive a fake Agent SDK client: no Claude Code login needed.
      - run: pip install -e ".[dev]"
      - run: pytest -q
