<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 716" width="1130" height="716" role="img" aria-label="Diagram: the Margin app connects over a LAN or VPN to margind on each host computer. margind drives Claude Code processes and reads their transcripts, proxies dev servers, and runs shells.">
      <style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d2330; }
.t { font-size: 13.5px; font-weight: 600; }
.s { font-size: 11.2px; fill: #5d6677; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #5d6677; }
.lab { font-size: 10.5px; fill: #5d6677; }
.head { font-family: Georgia, "Times New Roman", serif; font-size: 16px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1130" height="716" fill="#ffffff"/>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5d6677"/>
        </marker>
      </defs>

      <!-- app -->
      <rect x="10" y="20" width="270" height="676" rx="14" fill="#e9f0fc" stroke="#2f6fd6" stroke-width="1.5"/>
      <text x="28" y="50" class="head">Margin · iPad / iPhone</text>
      <g>
        <rect x="26" y="68" width="238" height="74" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
        <text x="38" y="90" class="t">Sidebar</text>
        <text x="38" y="108" class="s">Folio (plans waiting on you), then</text>
        <text x="38" y="124" class="s">each computer → project → chats</text>

        <rect x="26" y="154" width="238" height="112" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
        <text x="38" y="176" class="t">A chat's tabs</text>
        <text x="38" y="194" class="s">Chat · Changes · Files · Preview · Shell</text>
        <text x="38" y="212" class="s">Approvals, plan review, buttons,</text>
        <text x="38" y="228" class="s">mode / model / effort per chat,</text>
        <text x="38" y="244" class="s">things Claude shows, replies to tap</text>

        <rect x="26" y="278" width="238" height="92" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
        <text x="38" y="300" class="t">Pencil</text>
        <text x="38" y="318" class="s">Ink on chat, plans, diffs, files, renders</text>
        <text x="38" y="334" class="s">→ a PNG plus words for what each</text>
        <text x="38" y="350" class="s">stroke landed on, sent with the reply</text>

        <rect x="26" y="382" width="238" height="92" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
        <text x="38" y="404" class="t">Web preview</text>
        <text x="38" y="422" class="s">WKWebView through the proxy;</text>
        <text x="38" y="438" class="s">ink.js draws in the page; trusts</text>
        <text x="38" y="454" class="s">only the daemon's own CA</text>

        <rect x="26" y="486" width="238" height="74" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
        <text x="38" y="508" class="t">Shell tab</text>
        <text x="38" y="526" class="s">SwiftTerm: your shells + Claude's</text>
        <text x="38" y="542" class="s">background commands (read-only)</text>

        <rect x="26" y="572" width="238" height="108" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
        <text x="38" y="594" class="t">Pairing</text>
        <text x="38" y="612" class="s">QR or margin:// link: URL + token,</text>
        <text x="38" y="628" class="s">one per computer. Tokens in Keychain;</text>
        <text x="38" y="644" class="s">all merging happens on the device</text>
        <text x="38" y="664" class="m">Swift · SwiftUI · iOS 17+</text>
      </g>

      <!-- link band -->
      <text x="290" y="96" class="lab">HTTP · bearer token</text>
      <line x1="282" y1="104" x2="408" y2="104" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
      <text x="290" y="200" class="lab">WS /v1/events</text>
      <text x="290" y="214" class="lab">(replay by seq)</text>
      <line x1="408" y1="222" x2="282" y2="222" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="290" y="420" class="lab">HTTPS per port</text>
      <line x1="282" y1="428" x2="408" y2="428" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
      <text x="290" y="514" class="lab">WS terminal</text>
      <text x="290" y="528" class="lab">stream (bytes)</text>
      <line x1="282" y1="536" x2="408" y2="536" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
      <text x="292" y="616" class="lab">Push (optional)</text>
      <text x="292" y="630" class="lab">via APNs</text>
      <line x1="408" y1="638" x2="282" y2="638" stroke="#5d6677" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
      <text x="292" y="676" class="lab">LAN or VPN</text>
      <text x="292" y="690" class="lab">port 8787, 8790 …</text>

      <!-- more computers: offset copies behind the daemon -->
      <rect x="422" y="8" width="380" height="676" rx="14" fill="#f0ecfa" stroke="#6b4fbf" stroke-width="1" opacity="0.45"/>
      <rect x="416" y="14" width="380" height="676" rx="14" fill="#f0ecfa" stroke="#6b4fbf" stroke-width="1" opacity="0.7"/>
      <!-- daemon -->
      <rect x="410" y="20" width="380" height="676" rx="14" fill="#f0ecfa" stroke="#6b4fbf" stroke-width="1.5"/>
      <text x="428" y="50" class="head">margind · each computer</text>
      <text x="664" y="50" class="m">Python · FastAPI</text>

      <rect x="426" y="68" width="348" height="54" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
      <text x="438" y="90" class="t">API + event bus</text>
      <text x="438" y="108" class="s">Every change is an event; the app replays what it missed</text>

      <rect x="426" y="134" width="348" height="92" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
      <text x="438" y="156" class="t">Sessions</text>
      <text x="438" y="174" class="s">One live Claude per chat in use (claude-agent-sdk)</text>
      <text x="438" y="190" class="s">Permission prompts → approvals in the app</text>
      <text x="438" y="206" class="s">ExitPlanMode → a plan in the folio; hooks keep</text>
      <text x="438" y="220" class="s">Claude from opening windows on the host</text>

      <rect x="426" y="238" width="348" height="54" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
      <text x="438" y="260" class="t">Margin tools for Claude (in-process MCP)</text>
      <text x="438" y="278" class="m">show · suggest_replies · publish_page · set_action</text>

      <rect x="426" y="304" width="348" height="54" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
      <text x="438" y="326" class="t">Transcript reader</text>
      <text x="438" y="344" class="s">Chat list, history, background commands</text>

      <rect x="426" y="370" width="348" height="40" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
      <text x="438" y="395" class="t">Files · git review · renders</text>
      <text x="636" y="395" class="m">KiCad, STEP, PDF</text>

      <rect x="426" y="420" width="348" height="54" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
      <text x="438" y="442" class="t">Preview proxy</text>
      <text x="438" y="460" class="s">A port per dev server, TLS from its own CA</text>

      <rect x="426" y="486" width="348" height="74" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
      <text x="438" y="508" class="t">Shells</text>
      <text x="438" y="526" class="s">PTY per shell (ConPTY on Windows), scrollback</text>
      <text x="438" y="542" class="s">for reattach; GNU screen keeps them past restarts</text>

      <rect x="426" y="572" width="348" height="108" rx="8" fill="#ffffff" stroke="#c9cfdb"/>
      <text x="438" y="594" class="t">Also</text>
      <text x="438" y="612" class="s">Proposals store (plan versions + decisions)</text>
      <text x="438" y="628" class="s">Local status page (loopback only)</text>
      <text x="438" y="644" class="s">APNs push · writing help (revise a passage)</text>
      <text x="438" y="664" class="m">macOS · Linux · Windows · Python 3.11+</text>

      <!-- right column -->
      <rect x="830" y="68" width="280" height="158" rx="10" fill="#fbefe7" stroke="#c2622d" stroke-width="1.5"/>
      <text x="844" y="92" class="t">Claude Code</text>
      <text x="844" y="110" class="s">One process per live chat, same as</text>
      <text x="844" y="126" class="s">at the desk: your settings, CLAUDE.md,</text>
      <text x="844" y="142" class="s">skills, MCP servers</text>
      <text x="844" y="166" class="m">→ Anthropic API</text>
      <rect x="844" y="178" width="252" height="36" rx="6" fill="#ffffff" stroke="#c2622d" stroke-dasharray="4 3"/>
      <text x="856" y="200" class="s">Background commands (dev servers)</text>

      <rect x="830" y="246" width="280" height="112" rx="10" fill="#fbefe7" stroke="#c2622d" stroke-width="1.5"/>
      <text x="844" y="270" class="t">What Claude Code writes</text>
      <text x="844" y="290" class="m">~/.claude/projects/&lt;dir&gt;/&lt;id&gt;.jsonl</text>
      <text x="844" y="306" class="s">every chat, desk or app</text>
      <text x="844" y="328" class="m">&lt;temp&gt;/claude-*/…/tasks/*.output</text>
      <text x="844" y="344" class="s">background command output</text>

      <rect x="830" y="370" width="280" height="40" rx="10" fill="#e9f3ea" stroke="#4b7a52" stroke-width="1.5"/>
      <text x="844" y="395" class="t">Project folders</text>
      <text x="964" y="395" class="m">git, .margin/</text>

      <rect x="830" y="420" width="280" height="54" rx="10" fill="#e9f3ea" stroke="#4b7a52" stroke-width="1.5"/>
      <text x="844" y="442" class="t">Dev servers</text>
      <text x="844" y="460" class="m">localhost:5173, :8090 …</text>

      <rect x="830" y="486" width="280" height="74" rx="10" fill="#e9f3ea" stroke="#4b7a52" stroke-width="1.5"/>
      <text x="844" y="508" class="t">screen sessions</text>
      <text x="844" y="526" class="m">margin-&lt;project&gt;-&lt;n&gt;</text>
      <text x="844" y="544" class="s">attach at the desk: screen -x …</text>

      <rect x="830" y="572" width="280" height="108" rx="10" fill="#e9f3ea" stroke="#4b7a52" stroke-width="1.5"/>
      <text x="844" y="594" class="t">~/.margin/</text>
      <text x="844" y="612" class="s">device tokens, per-workspace state:</text>
      <text x="844" y="628" class="s">TLS CA + cert, per-chat settings,</text>
      <text x="844" y="644" class="s">proposals, published pages</text>
      <text x="844" y="664" class="m">workspaces/*.toml: projects, port</text>

      <!-- daemon ↔ right -->
      <line x1="774" y1="170" x2="828" y2="140" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="778" y="146" class="lab">drives</text>
      <line x1="828" y1="200" x2="776" y2="262" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="806" y="252" class="lab">calls</text>
      <line x1="776" y1="330" x2="828" y2="310" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="784" y="314" class="lab">reads</text>
      <line x1="776" y1="390" x2="828" y2="390" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
      <line x1="776" y1="447" x2="828" y2="447" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)"/>
      <text x="786" y="440" class="lab">proxies</text>
      <line x1="776" y1="523" x2="828" y2="523" stroke="#5d6677" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
      <!-- Claude starts servers -->
      <path d="M1104 214 C 1118 300, 1118 380, 1104 440" fill="none" stroke="#c2622d" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
      <path d="M1100 196 C 1116 230, 1116 290, 1104 320" fill="none" stroke="#c2622d" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
    </svg>
